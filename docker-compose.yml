# ERP Pessoal (Inova Labs) na VPS.
#
#   docker compose up -d --build postgres      sobe só o banco (Fase A/B)
#   docker compose up -d --build               sobe banco e aplicação
#   docker compose --profile tools run --rm migrate   aplica as migrações SQL
#   docker compose logs -f app                 acompanha
#
# A VPS já roda um Traefik (projeto traefik-s5fm) que é dono das portas 80 e
# 443 e atende também o AcertoCLT, Calculadora Nacional e o Meu Altar. Esta
# stack NÃO publica 80/443: ela se anuncia por labels e o Traefik faz o
# roteamento e o TLS. Publicar essas portas aqui derrubaria os outros sites.
#
# As variáveis vêm do arquivo .env ao lado deste (não versionado). Copie o
# .env.example.

name: erp-inova

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}

    ports:
      # Prefixo 127.0.0.1 de proposito: o Postgres escuta so no loopback da
      # VPS (para eu poder rodar psql/pg_restore direto), nunca exposto na
      # internet. Sem esse prefixo o Docker abriria a porta pro mundo.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - erp_inova_postgres_data:/var/lib/postgresql/data
      - ./infra/backups:/backups

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    shm_size: 256mb

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      args:
        # Só os componentes "use client" que ainda restam da Fase E usam
        # isso (mutação direta ao Supabase, migração pra Server Actions
        # ainda pendente) — leitura/autenticação server-side já não depende.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?defina NEXT_PUBLIC_SUPABASE_URL no .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?defina NEXT_PUBLIC_SUPABASE_ANON_KEY no .env}
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      NODE_ENV: production
      # Conecta como o papel restrito (erp_inova_app), NUNCA como o
      # POSTGRES_USER — esse é superusuário (assim a imagem oficial do
      # Postgres funciona) e superusuário ignora RLS por definição, não
      # importa a policy. Dentro da rede do compose o banco atende pelo
      # nome do serviço.
      DATABASE_URL: postgresql://erp_inova_app:${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      APP_URL: https://erp.jeffersonthales.com
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Substitui os buckets do Supabase Storage (avatars/arquivos) —
      # Fase D. Dono do diretório já vem certo do Dockerfile (usuário
      # nextjs), Docker propaga isso pro volume nomeado na 1a inicialização.
      STORAGE_DIR: /data/storage

    volumes:
      - erp_inova_storage:/data/storage

    # Sem `ports`: o Traefik alcança o contêiner pelo IP da rede bridge.
    expose:
      - "3000"

    labels:
      traefik.enable: "true"

      traefik.http.routers.erp-inova.rule: Host(`erp.jeffersonthales.com`)
      traefik.http.routers.erp-inova.entrypoints: websecure
      traefik.http.routers.erp-inova.tls.certresolver: letsencrypt

      traefik.http.services.erp-inova.loadbalancer.server.port: "3000"

      # Endereço anterior mantém os links existentes e leva ao domínio oficial.
      traefik.http.routers.erp-inova-old.rule: Host(`erp.inovalabs.io`)
      traefik.http.routers.erp-inova-old.entrypoints: websecure
      traefik.http.routers.erp-inova-old.tls.certresolver: letsencrypt
      traefik.http.routers.erp-inova-old.service: erp-inova
      traefik.http.routers.erp-inova-old.middlewares: erp-inova-domain
      traefik.http.middlewares.erp-inova-domain.redirectregex.regex: ^https://erp\.inovalabs\.io/(.*)
      traefik.http.middlewares.erp-inova-domain.redirectregex.replacement: https://erp.jeffersonthales.com/$${1}
      traefik.http.middlewares.erp-inova-domain.redirectregex.permanent: "true"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Serviço de uso pontual: aplica as migrações SQL contra o Postgres
  # self-hosted (Fase B). Usa a própria imagem do Postgres (já traz psql) —
  # não precisa buildar a aplicação Node só para rodar SQL.
  #
  # Pula as 4 migrações que só mexem no Storage do Supabase (storage.buckets /
  # storage.objects) — não existem fora do Supabase e serão substituídas pelo
  # armazenamento em disco da VPS na Fase D. O histórico continua intacto em
  # supabase/migrations/ (documentação do banco Supabase ainda em produção).
  #
  #   docker compose --profile tools run --rm migrate
  migrate:
    image: postgres:16-alpine
    profiles: ["tools"]
    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # Conecta como o superusuário só aqui, pra ter permissão de DDL
      # (create table/type/policy). A aplicação em si nunca usa este papel
      # (ver 0000_self_hosted_auth_compat.sql — cria o papel erp_inova_app,
      # sem bypass de RLS, usando a senha abaixo via variável do psql).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}
      # Fase D concluída: 0004/0005/0011/0016 mexem só no Storage do
      # Supabase (storage.buckets/storage.objects), substituído pelo disco
      # da VPS (STORAGE_DIR, ver serviço app acima) — continuam puladas.
      SKIP_MIGRATIONS: "0004_avatars_storage_bucket.sql 0005_avatars_drop_public_select_policy.sql 0011_arquivos_bucket.sql 0016_avatars_owner_select_policy.sql"

    volumes:
      - ./supabase/migrations:/migrations:ro

    entrypoint: >
      sh -c '
        for f in /migrations/*.sql; do
          name=$$(basename "$$f");
          case " $$SKIP_MIGRATIONS " in
            *" $$name "*) echo "-- pulando (Storage Supabase, ver Fase D): $$name"; continue;;
          esac;
          echo "==> $$name";
          psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -v app_pw="$$APP_DB_PASSWORD" -f "$$f" || exit 1;
        done
      '

volumes:
  erp_inova_postgres_data:
  erp_inova_storage:
